services:
  web:
    build: .
    container_name: semifinals_web
    ports:
      - "3001:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: semifinals_mysql
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/competitor17_semifinals-module.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data: